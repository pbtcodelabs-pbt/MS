<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>میڈیسن شیلف</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="fonts/JameelNooriNastaleeq.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Noori'; src: url('fonts/JameelNooriNastaleeq.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'NooriKasheeda'; src: url('fonts/JameelNooriNastaleeqKasheeda.woff2') format('woff2'); font-display: swap; }
  :root {
    --bg: #f0fdfa; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --main: #0f766e; --main2: #14b8a6; --soft: #ccfbf1; --line: #e2e8f0;
    --red: #dc2626; --gold: #d4a017; --blue: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noori', 'Jameel Noori Nastaleeq', system-ui, sans-serif;
    font-size: 20px; line-height: 1.9;
  }
  .en { font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
  header {
    background: linear-gradient(135deg, var(--main), var(--main2));
    color: #fff; padding: 12px 16px 14px; border-radius: 0 0 26px 26px;
    box-shadow: 0 6px 18px rgba(15,118,110,.25); position: sticky; top: 0; z-index: 5;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-family: 'NooriKasheeda', 'Noori', serif; font-size: 30px; font-weight: normal; }
  .badge {
    background: linear-gradient(135deg, #fde68a, var(--gold)); color: #422006;
    font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; direction: ltr; white-space: nowrap;
  }
  .sub { font-size: 16px; opacity: .9; margin-top: -4px; }
  .search {
    margin-top: 8px; display: flex; align-items: center; background: #fff;
    border-radius: 16px; padding: 2px 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,.06);
  }
  .search input {
    flex: 1; border: 0; outline: 0; font: inherit; font-size: 19px; padding: 8px 4px;
    background: transparent; color: var(--ink); min-width: 0;
  }
  .search span { font-size: 20px; }
  .search input::-webkit-search-cancel-button { display: none; }
  .clear { border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; display: none; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; border-radius: 20px; padding: 2px 14px; font: inherit; font-size: 17px;
    background: rgba(255,255,255,.22); color: #fff; cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: #fff; color: var(--main); font-weight: 700; }
  main { padding: 12px 16px 120px; max-width: 760px; margin: 0 auto; }
  .stats { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 16px; margin-bottom: 6px; gap: 8px; }
  .selbtn { border: 0; background: var(--soft); color: var(--main); border-radius: 12px; font: inherit; font-size: 16px; padding: 0 12px; cursor: pointer; }
  .card {
    background: var(--card); border-radius: 18px; padding: 10px 16px 12px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(15,23,42,.06); border-right: 5px solid var(--main2); position: relative;
  }
  .card.sel { outline: 3px solid var(--main2); background: #f0fdfa; }
  .card .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .name { font-size: 19px; font-weight: 700; color: var(--main); word-break: break-word; }
  .price {
    background: var(--soft); color: var(--main); font-weight: 700; border-radius: 12px;
    padding: 0 10px; white-space: nowrap; font-size: 15px;
  }
  .company { color: var(--muted); font-size: 17px; }
  .who { display: inline-block; background: #eef2ff; color: #4338ca; border-radius: 12px; padding: 0 10px; font-size: 16px; }
  .uses { margin-top: 4px; font-size: 19px; }
  .uses b { color: var(--main); }
  .date { display: inline-block; background: #fff7ed; color: #c2410c; border-radius: 12px; padding: 0 10px; font-size: 14px; margin-inline-start: 4px; }
  .tags { margin-top: 2px; }
  .note { font-size: 16px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 12px; padding: 4px 14px; font: inherit; font-size: 17px; cursor: pointer; }
  .btn.edit { background: var(--soft); color: var(--main); }
  .btn.share { background: #dcfce7; color: #15803d; }
  .btn.del { background: #fee2e2; color: var(--red); }
  .check {
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--main2); flex: none;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; margin-top: 6px;
  }
  .card.sel .check { background: var(--main2); }
  mark { background: #fef08a; border-radius: 4px; padding: 0 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty .big { font-size: 54px; line-height: 1.4; }
  .fab {
    position: fixed; left: 20px; bottom: 22px; width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(135deg, var(--main), var(--main2)); color: #fff; border: 0;
    font-size: 34px; line-height: 1; box-shadow: 0 8px 20px rgba(15,118,110,.4); cursor: pointer; z-index: 6;
  }
  .selbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; color: #fff; z-index: 7;
    display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 14px;
  }
  .selbar.show { display: flex; }
  .selbar .btn { font-size: 17px; }
  .menu-btn { background: rgba(255,255,255,.2); border: 0; color: #fff; border-radius: 12px; font-size: 20px; padding: 2px 10px; cursor: pointer; }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 620px; border-radius: 24px 24px 0 0;
    padding: 14px 18px 22px; max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 6px; font-family: 'NooriKasheeda', 'Noori', serif; font-size: 26px; font-weight: normal; color: var(--main); }
  label { display: block; font-size: 17px; color: var(--muted); margin-top: 6px; }
  .frow { display: flex; gap: 8px; align-items: stretch; }
  .field {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 12px;
    font: inherit; font-size: 19px; outline: 0; background: #f8fafc; min-width: 0;
  }
  .field:focus { border-color: var(--main2); background: #fff; }
  textarea.field { min-height: 90px; resize: vertical; }
  .scan {
    flex: none; width: 50px; border: 0; border-radius: 12px; background: var(--main); color: #fff;
    font-size: 22px; cursor: pointer;
  }
  .hint { font-size: 15px; color: var(--muted); }
  .whochips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .whochips button { border: 0; background: #eef2ff; color: #4338ca; border-radius: 14px; padding: 0 12px; font: inherit; font-size: 16px; cursor: pointer; }
  .sheet .row { display: flex; gap: 10px; margin-top: 14px; }
  .sheet .row .btn { flex: 1; padding: 8px; font-size: 19px; }
  .btn.save { background: var(--main); color: #fff; }
  .btn.cancel { background: #f1f5f9; color: var(--ink); }
  .menu-list > button {
    display: block; width: 100%; text-align: right; background: #f8fafc; border: 0;
    border-radius: 12px; padding: 8px 14px; margin-top: 8px; font: inherit; font-size: 19px; cursor: pointer;
  }
  .scanimg { width: 100%; max-height: 220px; object-fit: contain; border-radius: 12px; background: #f1f5f9; }
  .ocrlines { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ocrlines button {
    border: 1.5px solid var(--main2); background: #f0fdfa; color: var(--ink); border-radius: 12px;
    padding: 4px 12px; font-family: system-ui, sans-serif; font-size: 15px; cursor: pointer; direction: ltr;
  }
  .bar { height: 8px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .bar div { height: 100%; width: 0; background: var(--main2); transition: width .3s; }
  .rlist { background: #f8fafc; border-radius: 12px; padding: 6px 12px; margin-top: 8px; font-size: 17px; }
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #0f172a;
    color: #fff; padding: 4px 18px; border-radius: 20px; font-size: 17px; display: none; z-index: 30; white-space: nowrap;
  }
  .num { font-family: system-ui, sans-serif; }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>💊 میڈیسن شیلف</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge" id="homeVersionBadge">MS1610FR001</span>
      <button class="menu-btn" onclick="openBox('menuBox')" aria-label="مینو">☰</button>
    </div>
  </div>
  <div class="sub">دوائیوں کا مکمل ریکارڈ</div>
  <div class="search">
    <span>🔍</span>
    <input id="q" type="search" dir="auto" placeholder="دوائی، کمپنی، نام، بیماری یا تاریخ لکھیں…" autocomplete="off" oninput="render()">
    <button class="clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="cats" id="cats"></div>
</header>

<main>
  <div class="stats">
    <span id="countText"></span>
    <span id="totalText"></span>
    <button class="selbtn" id="selToggle" onclick="toggleSelect()">☑️ کئی منتخب کریں</button>
  </div>
  <div id="list"></div>
</main>

<button class="fab" id="fab" onclick="openForm()" aria-label="نئی دوائی">+</button>

<div class="selbar" id="selbar">
  <span id="selCount">0 منتخب</span>
  <div style="display:flex;gap:8px">
    <button class="btn" style="background:#334155;color:#fff" onclick="selectAllVisible()">سب</button>
    <button class="btn share" onclick="shareSelected()">📤 شیئر کریں</button>
    <button class="btn cancel" onclick="toggleSelect(false)">✕</button>
  </div>
</div>

<!-- دوائی کا فارم -->
<div class="overlay" id="formBox" onclick="if(event.target===this)closeBox('formBox')">
  <div class="sheet">
    <h2 id="formTitle">نئی دوائی</h2>
    <div class="hint">📷 دبا کر ڈبے کا وہ حصہ اسکین کریں جہاں نام / کمپنی / قیمت لکھی ہو</div>

    <label>دوائی کا نام * <span class="hint">(اردو یا انگلش)</span></label>
    <div class="frow">
      <input class="field" id="fName" dir="auto" placeholder="Panadol / پیناڈول">
      <button class="scan" onclick="startScan('name')" aria-label="اسکین">📷</button>
    </div>

    <label>بنانے والی کمپنی <span class="hint">(اردو یا انگلش)</span></label>
    <div class="frow">
      <input class="field" id="fCompany" dir="auto" placeholder="GSK / جی ایس کے">
      <button class="scan" onclick="startScan('company')" aria-label="اسکین">📷</button>
    </div>

    <label>قیمت (روپے)</label>
    <div class="frow">
      <input class="field num" id="fPrice" type="number" inputmode="decimal" placeholder="0">
      <button class="scan" onclick="startScan('price')" aria-label="اسکین">📷</button>
    </div>

    <label>کس تاریخ کو استعمال ہوئی؟</label>
    <input class="field num" id="fDate" type="date">

    <label>کس کی دوائی ہے؟ <span class="hint">(زمرہ)</span></label>
    <input class="field" id="fWho" dir="auto" list="whoList" placeholder="مثلاً عبدالحفیظ">
    <datalist id="whoList"></datalist>
    <div class="whochips" id="whoChips"></div>

    <label>علامات / کس بیماری کے لیے</label>
    <textarea class="field" id="fUses" dir="auto" placeholder="مثلاً بخار، سر درد، جسم درد"></textarea>

    <label>نوٹ (خوراک وغیرہ)</label>
    <input class="field" id="fNote" dir="auto" placeholder="مثلاً دن میں دو بار کھانے کے بعد">

    <div class="row">
      <button class="btn save" onclick="saveMed()">✔ محفوظ کریں</button>
      <button class="btn cancel" onclick="closeBox('formBox')">واپس</button>
    </div>
  </div>
</div>

<!-- اسکینر -->
<input type="file" id="camFile" accept="image/*" capture="environment" style="display:none" onchange="onScanImage(this)">
<div class="overlay" id="scanBox" style="z-index:25" onclick="if(event.target===this)closeBox('scanBox')">
  <div class="sheet">
    <h2 id="scanTitle">اسکین</h2>
    <img id="scanImg" class="scanimg" alt="">
    <div id="scanStatus" class="hint"></div>
    <div class="bar"><div id="scanBar"></div></div>
    <div class="hint" id="scanPick" style="display:none;margin-top:6px">درست لفظ پر ٹیپ کریں — خانے میں لگ جائے گا:</div>
    <div class="ocrlines" id="ocrLines"></div>
    <div class="row">
      <button class="btn save" onclick="document.getElementById('camFile').click()">📷 دوبارہ اسکین</button>
      <button class="btn cancel" onclick="closeBox('scanBox')">واپس</button>
    </div>
  </div>
</div>

<!-- وصول شدہ دوائیاں -->
<div class="overlay" id="recvBox">
  <div class="sheet">
    <h2>📥 دوائیاں وصول ہوئیں</h2>
    <div id="recvInfo" class="hint"></div>
    <div id="recvList" class="rlist"></div>
    <label>کس کی دوائی کے نام سے محفوظ کریں؟</label>
    <input class="field" id="recvWho" dir="auto" list="whoList" placeholder="مثلاً عبدالحفیظ">
    <div class="row">
      <button class="btn save" onclick="saveReceived()">✔ محفوظ کریں</button>
      <button class="btn cancel" onclick="cancelReceived()">نہیں</button>
    </div>
  </div>
</div>

<!-- مینو -->
<div class="overlay" id="menuBox" onclick="if(event.target===this)closeBox('menuBox')">
  <div class="sheet menu-list">
    <h2>مینو</h2>
    <button onclick="shareAll()">📤 جو دوائیاں سامنے ہیں وہ سب شیئر کریں</button>
    <button onclick="document.getElementById('recvFile').click()">📥 شیئر شدہ فائل وصول کریں</button>
    <button onclick="backup()">💾 مکمل بیک اپ فائل محفوظ کریں</button>
    <button onclick="document.getElementById('restoreFile').click()">♻️ بیک اپ سے واپس لائیں</button>
    <button onclick="closeBox('menuBox')">✕ بند کریں</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restore(this)">
    <input type="file" id="recvFile" accept=".json,application/json" style="display:none" onchange="receiveFile(this)">
    <p class="hint" style="text-align:center">ورژن <span class="num">MS1610FR001</span> — ڈیٹا اسی فون میں محفوظ ہے، وقتاً فوقتاً بیک اپ بنا لیں</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APP_VERSION = 'MS1610FR001';
const KEY = 'medicineShelf.v1';
const KEY_BAK = 'medicineShelf.v1.bak';
const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let meds = [];
let editId = null;
let curCat = '';
let selMode = false;
let selected = new Set();
let scanField = null;
let received = null;

const $ = id => document.getElementById(id);

// ---------- محفوظ کرنا ----------
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_BAK); } catch (e) {}
  try { meds = JSON.parse(raw) || []; } catch (e) { meds = []; }
}
function persist() {
  try {
    const s = JSON.stringify(meds);
    localStorage.setItem(KEY, s);
    localStorage.setItem(KEY_BAK, s);
  } catch (e) { toast('محفوظ نہیں ہو سکا'); }
}

// ---------- تلاش ----------
// چھوٹے حروف، اعراب اور فاصلے ہٹانا، ملتے جلتے اردو حروف ایک کرنا
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ٰٟ]/g, '')
    .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/ة/g, 'ہ').replace(/ھ/g, 'ہ')
    .replace(/[أإآ]/g, 'ا').replace(/ۓ/g, 'ے')
    .replace(/[\s\-_.,،]+/g, '');
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hl(text, q) {
  const t = String(text || '');
  if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}
function isLatin(s) { return /^[\x00-\x7F\s]*$/.test(String(s || '')); }
function fmtPrice(p) {
  if (p === '' || p === null || p === undefined || isNaN(p)) return '';
  return 'Rs ' + Number(p).toLocaleString('en-PK');
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDate(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : String(iso || '');
}
function people() {
  const map = {};
  meds.forEach(m => { const w = m.who || ''; map[w] = (map[w] || 0) + 1; });
  return map;
}

function visibleList() {
  const raw = $('q').value.trim();
  const q = norm(raw);
  let list = meds.filter(m => !curCat || (curCat === '-' ? !m.who : m.who === curCat));
  if (q) {
    list = list.map(m => {
      const n = norm(m.name);
      let score = -1;
      if (n.startsWith(q)) score = 0;
      else if (n.includes(q)) score = 1;
      else if (norm(m.company).includes(q)) score = 2;
      else if (norm(m.uses).includes(q) || norm(m.note).includes(q)) score = 3;
      else if (norm(m.who).includes(q)) score = 4;
      else if (norm(fmtDate(m.date)).includes(q) || norm(m.date).includes(q)) score = 5;
      return { m, score };
    }).filter(x => x.score >= 0)
      .sort((a, b) => a.score - b.score || a.m.name.localeCompare(b.m.name))
      .map(x => x.m);
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }
  return list;
}

function renderCats() {
  const p = people();
  const names = Object.keys(p).filter(Boolean).sort((a, b) => a.localeCompare(b));
  let html = `<button class="chip ${curCat === '' ? 'on' : ''}" onclick="setCat('')">سب (${meds.length})</button>`;
  html += names.map(n => `<button class="chip ${curCat === n ? 'on' : ''}" onclick="setCat(this.dataset.n)" data-n="${esc(n)}">👤 ${esc(n)} (${p[n]})</button>`).join('');
  if (p[''] && names.length) html += `<button class="chip ${curCat === '-' ? 'on' : ''}" onclick="setCat('-')">بغیر نام (${p['']})</button>`;
  $('cats').innerHTML = html;
  $('whoList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
}
function setCat(c) { curCat = c; render(); }

function render() {
  if (curCat && curCat !== '-' && !meds.some(m => m.who === curCat)) curCat = '';
  renderCats();
  const raw = $('q').value.trim();
  $('clearBtn').style.display = raw ? 'block' : 'none';
  const list = visibleList();

  $('countText').textContent = raw || curCat ? `${list.length} دوائیاں` : `کل ${meds.length} دوائیاں`;
  const total = list.reduce((s, m) => s + (Number(m.price) || 0), 0);
  $('totalText').textContent = total ? `قیمت: ${fmtPrice(total)}` : '';
  $('selToggle').style.display = meds.length ? '' : 'none';

  const box = $('list');
  if (!list.length) {
    box.innerHTML = meds.length
      ? `<div class="empty"><div class="big">🔎</div>کوئی دوائی نہیں ملی</div>`
      : `<div class="empty"><div class="big">💊</div>ابھی کوئی دوائی شامل نہیں<br>نیچے <b>+</b> دبا کر پہلی دوائی شامل کریں</div>`;
    updateSelBar();
    return;
  }
  box.innerHTML = list.map(m => `
    <div class="card ${selected.has(m.id) ? 'sel' : ''}" ${selMode ? `onclick="toggleOne('${m.id}')"` : ''}>
      <div class="row1">
        ${selMode ? `<div class="check">${selected.has(m.id) ? '✓' : ''}</div>` : ''}
        <div style="flex:1;min-width:0">
          <div class="name ${isLatin(m.name) ? 'en' : ''}" dir="auto">${hl(m.name, raw)}</div>
          ${m.company ? `<div class="company">🏭 <span class="${isLatin(m.company) ? 'en' : ''}" dir="auto">${hl(m.company, raw)}</span></div>` : ''}
        </div>
        ${m.price !== '' && m.price != null ? `<div class="price num">${fmtPrice(m.price)}</div>` : ''}
      </div>
      ${m.who || m.date ? `<div class="tags">${m.who ? `<span class="who">👤 ${hl(m.who, raw)} کی دوائی</span>` : ''}${m.date ? `<span class="date num">📅 ${fmtDate(m.date)}</span>` : ''}</div>` : ''}
      ${m.uses ? `<div class="uses" dir="auto"><b>علامات:</b> ${hl(m.uses, raw)}</div>` : ''}
      ${m.note ? `<div class="note" dir="auto">📝 ${hl(m.note, raw)}</div>` : ''}
      ${selMode ? '' : `<div class="actions">
        <button class="btn share" onclick="shareMeds(['${m.id}'])">📤 شیئر</button>
        <button class="btn edit" onclick="openForm('${m.id}')">✏️ تبدیل</button>
        <button class="btn del" onclick="delMed('${m.id}')">🗑️ حذف</button>
      </div>`}
    </div>`).join('');
  updateSelBar();
}
function clearSearch() { $('q').value = ''; render(); $('q').focus(); }

// ---------- ڈبے ----------
function openBox(id) { $(id).classList.add('show'); }
function closeBox(id) { $(id).classList.remove('show'); }

// ---------- فارم ----------
function openForm(id) {
  editId = id || null;
  const m = meds.find(x => x.id === id) || { who: curCat && curCat !== '-' ? curCat : '' };
  $('formTitle').textContent = id ? 'دوائی تبدیل کریں' : 'نئی دوائی';
  $('fName').value = m.name || '';
  $('fCompany').value = m.company || '';
  $('fPrice').value = m.price ?? '';
  $('fWho').value = m.who || '';
  $('fDate').value = m.date || (id ? '' : today());
  $('fUses').value = m.uses || '';
  $('fNote').value = m.note || '';
  const names = Object.keys(people()).filter(Boolean);
  $('whoChips').innerHTML = names.map(n => `<button type="button" data-n="${esc(n)}" onclick="$('fWho').value=this.dataset.n">${esc(n)}</button>`).join('');
  openBox('formBox');
}

function saveMed() {
  const name = $('fName').value.trim();
  if (!name) { toast('دوائی کا نام لکھیں'); return; }
  const priceVal = $('fPrice').value.trim();
  const data = {
    name,
    company: $('fCompany').value.trim(),
    price: priceVal === '' ? '' : Number(priceVal),
    who: $('fWho').value.trim(),
    date: $('fDate').value,
    uses: $('fUses').value.trim(),
    note: $('fNote').value.trim(),
    updated: Date.now()
  };
  if (editId) {
    const i = meds.findIndex(x => x.id === editId);
    if (i >= 0) meds[i] = { ...meds[i], ...data };
    toast('دوائی تبدیل ہو گئی');
  } else {
    meds.push({ id: newId(), created: Date.now(), ...data });
    toast('دوائی محفوظ ہو گئی');
  }
  persist(); closeBox('formBox'); render();
}
function newId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function delMed(id) {
  const m = meds.find(x => x.id === id);
  if (!m || !confirm(`"${m.name}" کو حذف کریں؟`)) return;
  meds = meds.filter(x => x.id !== id);
  persist(); render(); toast('حذف ہو گئی');
}

// ---------- اسکینر (تصویر سے لکھائی پڑھنا) ----------
let ocrLoading = null;
function loadOCR() {
  if (window.Tesseract) return Promise.resolve();
  if (ocrLoading) return ocrLoading;
  ocrLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = OCR_SRC; s.onload = res;
    s.onerror = () => { ocrLoading = null; rej(); };
    document.head.appendChild(s);
  });
  return ocrLoading;
}
function startScan(field) {
  scanField = field;
  loadOCR().catch(() => {});
  $('camFile').click();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d');
      g.filter = 'grayscale(1) contrast(1.4)';
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', .9));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function onScanImage(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  const titles = { name: 'دوائی کا نام اسکین', company: 'کمپنی کا نام اسکین', price: 'قیمت اسکین' };
  $('scanTitle').textContent = titles[scanField];
  $('ocrLines').innerHTML = ''; $('scanPick').style.display = 'none';
  $('scanBar').style.width = '5%';
  $('scanStatus').textContent = 'تصویر پڑھی جا رہی ہے… (پہلی بار انٹرنیٹ ضروری ہے)';
  openBox('scanBox');
  try {
    const data = await shrink(f);
    $('scanImg').src = data;
    await loadOCR();
    const r = await Tesseract.recognize(data, 'eng', {
      logger: m => { if (m.status === 'recognizing text') $('scanBar').style.width = Math.max(10, m.progress * 100) + '%'; }
    });
    $('scanBar').style.width = '100%';
    showOcrResult(r.data.text || '');
  } catch (e) {
    $('scanStatus').textContent = 'اسکین نہیں ہو سکا — انٹرنیٹ چیک کریں یا دوبارہ کوشش کریں';
  }
}
function showOcrResult(text) {
  const lines = text.split('\n').map(s => s.replace(/[|_~`^*{}\[\]<>]+/g, ' ').replace(/\s+/g, ' ').trim())
    .filter(s => /[A-Za-z0-9]{2,}/.test(s));
  let options = [];
  if (scanField === 'price') {
    // قیمت: Rs / MRP / Price کے ساتھ والے نمبر پہلے
    const pri = [], rest = [];
    lines.forEach(l => {
      const nums = (l.match(/\d+(?:[.,]\d{1,2})?/g) || []).map(n => n.replace(',', '.'))
        .filter(n => Number(n) >= 1 && Number(n) <= 100000);
      (/(rs|mrp|price|retail|pkr|rupee)/i.test(l) ? pri : rest).push(...nums);
    });
    options = [...new Set([...pri, ...rest])].slice(0, 20);
  } else {
    const set = new Set();
    lines.forEach(l => {
      set.add(l);
      // ہر لائن کے الگ الفاظ بھی، تاکہ صرف نام چنا جا سکے
      l.split(' ').filter(w => /[A-Za-z]{3,}/.test(w)).forEach(w => set.add(w.replace(/[^A-Za-z0-9+\-.&]/g, '')));
    });
    options = [...set].filter(Boolean).slice(0, 40);
  }
  if (!options.length) {
    $('scanStatus').textContent = 'کچھ نہیں پڑھا جا سکا — ڈبہ قریب اور روشنی میں رکھ کر دوبارہ اسکین کریں';
    return;
  }
  $('scanStatus').textContent = '';
  $('scanPick').style.display = 'block';
  $('ocrLines').innerHTML = options.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join('');
  $('ocrLines').querySelectorAll('button').forEach(b => b.onclick = () => pickOcr(options[b.dataset.i]));
}
function pickOcr(val) {
  const map = { name: 'fName', company: 'fCompany', price: 'fPrice' };
  if (scanField !== 'price') val = tidy(val);
  $(map[scanField]).value = val;
  closeBox('scanBox');
  toast('خانے میں لگ گیا ✔');
}
function tidy(s) {
  s = s.trim();
  if (s === s.toUpperCase() && s.length > 3) s = s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
  return s;
}

// ---------- منتخب کرنا ----------
function toggleSelect(on) {
  selMode = on === undefined ? !selMode : on;
  if (!selMode) selected.clear();
  $('fab').style.display = selMode ? 'none' : '';
  $('selToggle').textContent = selMode ? '✕ منسوخ' : '☑️ کئی منتخب کریں';
  render();
}
function toggleOne(id) { selected.has(id) ? selected.delete(id) : selected.add(id); render(); }
function selectAllVisible() {
  const ids = visibleList().map(m => m.id);
  const all = ids.every(id => selected.has(id));
  ids.forEach(id => all ? selected.delete(id) : selected.add(id));
  render();
}
function updateSelBar() {
  $('selbar').classList.toggle('show', selMode);
  $('selCount').textContent = `${selected.size} منتخب`;
}
function shareSelected() {
  if (!selected.size) { toast('پہلے دوائیاں منتخب کریں'); return; }
  shareMeds([...selected]);
}
function shareAll() {
  closeBox('menuBox');
  const ids = visibleList().map(m => m.id);
  if (!ids.length) { toast('کوئی دوائی نہیں'); return; }
  shareMeds(ids);
}

// ---------- شیئر ----------
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64dec(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function packMeds(list) {
  return list.map(m => ({ n: m.name, c: m.company || '', p: m.price ?? '', w: m.who || '', u: m.uses || '', t: m.note || '', d: m.date || '' }));
}
function unpackMeds(arr) {
  return arr.filter(x => x && (x.n || x.name)).map(x => ({
    name: x.n ?? x.name, company: x.c ?? x.company ?? '', price: x.p ?? x.price ?? '',
    who: x.w ?? x.who ?? '', uses: x.u ?? x.uses ?? '', note: x.t ?? x.note ?? '', date: x.d ?? x.date ?? ''
  }));
}
async function shareMeds(ids) {
  const list = ids.map(id => meds.find(m => m.id === id)).filter(Boolean);
  if (!list.length) return;
  const whos = [...new Set(list.map(m => m.who).filter(Boolean))];
  let text = '💊 *میڈیسن شیلف*\n';
  if (whos.length === 1) text += `👤 ${whos[0]} کی دوائیاں\n`;
  text += '\n';
  list.forEach((m, i) => {
    text += `${i + 1}) *${m.name}*`;
    if (m.company) text += ` — ${m.company}`;
    if (m.price !== '' && m.price != null) text += ` — ${fmtPrice(m.price)}`;
    text += '\n';
    if (m.who && whos.length > 1) text += `   👤 ${m.who}\n`;
    if (m.date) text += `   📅 تاریخ: ${fmtDate(m.date)}\n`;
    if (m.uses) text += `   علامات: ${m.uses}\n`;
    if (m.note) text += `   نوٹ: ${m.note}\n`;
  });
  const link = location.origin + location.pathname + '#share=' + b64enc(JSON.stringify({ v: 1, m: packMeds(list) }));
  text += `\n📲 اپنی میڈیسن شیلف ایپ میں محفوظ کرنے کے لیے یہ لنک کھولیں:\n${link}`;

  try {
    if (navigator.share) { await navigator.share({ title: 'میڈیسن شیلف', text }); toggleSelect(false); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  toggleSelect(false);
}

// ---------- وصول کرنا ----------
function checkIncoming() {
  const h = location.hash;
  if (!h.startsWith('#share=')) return;
  try {
    const data = JSON.parse(b64dec(h.slice(7)));
    showReceived(unpackMeds(data.m || []));
  } catch (e) { toast('لنک درست نہیں'); }
  history.replaceState(null, '', location.pathname);
}
function receiveFile(input) {
  const f = input.files[0]; input.value = '';
  if (!f) return;
  closeBox('menuBox');
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const arr = Array.isArray(d) ? d : (d.m || d.meds);
      showReceived(unpackMeds(arr || []));
    } catch (e) { toast('یہ درست فائل نہیں'); }
  };
  r.readAsText(f);
}
function showReceived(list) {
  if (!list.length) { toast('کوئی دوائی نہیں ملی'); return; }
  received = list;
  const whos = [...new Set(list.map(m => m.who).filter(Boolean))];
  $('recvInfo').textContent = `${list.length} دوائیاں`;
  $('recvList').innerHTML = list.map(m =>
    `<div>💊 <b dir="auto">${esc(m.name)}</b>${m.company ? ' — ' + esc(m.company) : ''}${m.price !== '' ? ' — ' + fmtPrice(m.price) : ''}${m.who ? ' — 👤 ' + esc(m.who) : ''}${m.date ? ' — 📅 ' + fmtDate(m.date) : ''}</div>`).join('');
  $('recvWho').value = whos.length === 1 ? whos[0] : '';
  $('recvWho').placeholder = whos.length > 1 ? 'خالی چھوڑیں تو ہر ایک اپنے نام سے محفوظ ہوگی' : 'مثلاً عبدالحفیظ';
  openBox('recvBox');
}
function saveReceived() {
  if (!received) return;
  const who = $('recvWho').value.trim();
  let added = 0, updated = 0;
  received.forEach(r => {
    const m = { ...r, who: who || r.who };
    const ex = meds.find(x => norm(x.name) === norm(m.name) && norm(x.company) === norm(m.company) && (x.who || '') === (m.who || ''));
    if (ex) { Object.assign(ex, m, { updated: Date.now() }); updated++; }
    else { meds.push({ id: newId(), created: Date.now(), updated: Date.now(), ...m }); added++; }
  });
  persist(); received = null; closeBox('recvBox');
  if (who) curCat = who;
  render();
  toast(`${added} نئی محفوظ${updated ? `، ${updated} تازہ` : ''}`);
}
function cancelReceived() { received = null; closeBox('recvBox'); }

// ---------- بیک اپ ----------
function backup() {
  const blob = new Blob([JSON.stringify({ app: 'MedicineShelf', version: APP_VERSION, meds }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `medicine-shelf-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  closeBox('menuBox'); toast('بیک اپ فائل محفوظ ہو گئی');
}
function restore(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const arr = Array.isArray(data) ? data : data.meds;
      if (!Array.isArray(arr)) throw 0;
      if (!confirm(`${arr.length} دوائیاں واپس لائی جائیں؟ موجودہ ریکارڈ بدل جائے گا۔`)) return;
      meds = arr.filter(m => m && m.name).map(m => ({ ...m, id: m.id || newId() }));
      persist(); render(); closeBox('menuBox'); toast('ریکارڈ واپس آ گیا');
    } catch (e) { toast('یہ درست بیک اپ فائل نہیں'); }
    input.value = '';
  };
  r.readAsText(f);
}

let tt;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 2200);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ['formBox', 'menuBox', 'scanBox'].forEach(closeBox);
});
window.addEventListener('hashchange', checkIncoming);

load(); render(); checkIncoming();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
